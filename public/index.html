<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog Battle</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* Modern Game Styling */
        body {
            background: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .scoreboard {
            display: flex;
            gap: 50px;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #gameCanvas {
            background: #74c0fc;
            /*border: 6px solid #333;*/
            border: 8px solid #222;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 95vw;
            max-height: 80vh;
        }

        .controls-hint {
            margin-top: 20px;
            color: #888;
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.5;
        }

        .p1-color { color: #4CAF50; }
        .p2-color { color: #2E7D32; }
    </style>
</head>
<body>

    <div class="scoreboard">
        <div class="p1-color" id="s1">Score: 0 | Lives: 3</div>
        <div class="p2-color" id="s2">Score: 0 | Lives: 3</div>
    </div>

    <canvas id="gameCanvas" width="1200" height="600"></canvas>

    <div class="controls-hint">
        <span class="p1-color"><b>Player 1:</b> [W/S] to Aim, [Space] to Fire</span><br>
        <span class="p2-color"><b>Player 2:</b> [↑/↓] to Aim, [Enter] to Fire</span>
    </div>

    <script type="module" src="js/main.js"></script>
    
    <div id="damageFlash"></div>

    <style>
        #damageFlash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 0, 0, 0.4); /* Red with 40% transparency */
            pointer-events: none; /* Allows clicks to go through it */
            opacity: 0; /* Hidden by default */
            z-index: 999;
        }
    
        /* The animation class */
        .flash-hit {
            animation: flashAnim 0.3s ease-out;
        }
    
        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
</style>
</body>
</html>
